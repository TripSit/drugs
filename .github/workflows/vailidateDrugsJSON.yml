name: Validate drugs.json changes

on:
  push:

jobs:
  validate-jsons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Start Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '21'

      - name: Install AJV
        run: npm install -g ajv-cli@ 8.20.0

      - name: Validate JSON files
        run: |
          for file in drug_files/*.json; do
            echo "Validating: $file"
            ajv validate -s 'schemas/drugs-schema.json' -d "$file"
            if [ $? -ne 0 ]; then
              echo "Validation failed for $file"
              exit 1  # Exit the workflow if validation fails
            fi
          done

      - name: Build drugs.json
        if: success()
        run: npx ts-node ./scripts/your_script.ts